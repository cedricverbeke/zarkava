# GitHub Actions workflow that deploys the Vite app to Netlify on every push to main.
# Requires these repo secrets (Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN     — personal access token from https://app.netlify.com/user/applications
#   NETLIFY_SITE_ID        — site API ID from Netlify site settings → General → Site details
# This workflow builds the app itself, so these must also be GitHub Actions secrets:
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
# Configure them in Netlify too only if Netlify also builds/deploys the site directly.

name: Build and deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::Missing GitHub Actions secret NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing GitHub Actions secret NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "::error::Missing GitHub Actions secret NETLIFY_AUTH_TOKEN"; exit 1; }
          test -n "$NETLIFY_SITE_ID" || { echo "::error::Missing GitHub Actions secret NETLIFY_SITE_ID"; exit 1; }

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./dist
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: Deploy from GitHub Actions
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
