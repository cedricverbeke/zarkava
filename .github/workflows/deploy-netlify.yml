# GitHub Actions workflow that deploys the Vite app to Netlify on every push to main.
# Requires these repo secrets (Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN     — personal access token from https://app.netlify.com/user/applications
#   NETLIFY_SITE_ID        — site API ID from Netlify site settings → General → Site details
# Add the same env vars to Netlify (Site settings → Environment variables):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# Stripe secrets (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_ID) are NOT
# needed by the frontend — they live as Supabase edge-function secrets configured in Bolt.

name: Build and deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./dist
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: Deploy from GitHub Actions
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
